spring:
  application:
    name: Bakend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:madalogistics}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:?JWT_SECRET must be set}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
  refresh:
    token-expiration-days: 7
  vrp:
    time-limit-seconds: ${VRP_TIME_LIMIT_SECONDS:10}
    matrix-provider: ${VRP_MATRIX_PROVIDER:osrm}
  maps:
    routing-url: ${MAPS_ROUTING_URL:https://router.project-osrm.org}
    routing-timeout: ${MAPS_ROUTING_TIMEOUT:5s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
