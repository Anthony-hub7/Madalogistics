</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block" for="password">Mot de passe</label>

<option value="driver">Chauffeur</option>

<script>
        // Micro-interaction for input floating feel or focus states
        document.querySelectorAll('input, select').forEach(element => {
            element.addEventListener('focus', () => {
                element.closest('.relative').querySelector('.material-symbols-outlined').style.color = '#00348f';
            });
            element.addEventListener('blur', () => {
                element.closest('.relative').querySelector('.material-symbols-outlined').style.color = '#434653';
            });
        });

        // Add visual feedback for login button
        const loginBtn = document.querySelector('button[type="submit"]');
        loginBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const originalContent = loginBtn.innerHTML;
            loginBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Connexion...';
            loginBtn.classList.add('opacity-80');
            
            setTimeout(() => {
                loginBtn.innerHTML = originalContent;
                loginBtn.classList.remove('opacity-80');
            }, 1500);
        });
    </script>
