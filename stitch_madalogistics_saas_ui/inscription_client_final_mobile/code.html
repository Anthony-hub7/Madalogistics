<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>

                        "on-tertiary-container": "#ffb95f",
                        "inverse-surface": "#213145",

                        "on-surface": "#0b1c30"
                    },
                    "borderRadius": {

                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Hanken Grotesk', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .geist-font { font-family: 'Geist', sans-serif; }
        
        /* Custom scrollbar for better mobile feel */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #E2E8F0; border-radius: 10px; }

        /* Animation for form focus */
        .input-group:focus-within label {
            color: #00348f;
        }
        
        .password-strength-bar {
            height: 4px;
            border-radius: 2px;
            transition: width 0.3s ease, background-color 0.3s ease;
        }
    </style>
</head>
<body class="bg-[#F8FAFC] text-on-surface min-h-screen flex flex-col items-center p-margin-mobile">
<!-- Top spacing for status bar on mobile -->
<div class="h-4 w-full"></div>
<!-- Main Container -->
<div class="w-full max-w-[440px] flex flex-col">
<!-- Logo Section -->
<div class="flex flex-col items-center mb-8">
<img alt="MadaLogistics Logo" class="w-20 h-20 mb-4 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAm60SOFnlBHv6YpQ8lEQ9nYUEbycV3olSw-WRVBDvsK97Luw7a4DTvCuoZfXtxCJfqf8U6N6lrvWiTbNDqB-Ce2wn4KucUaB7gbxaqZHF5COwwcHzLZm0OXQf3FkqOwMhLjLo9iEZbIxVJBLwZ_xnl9H8JOctMzv8LDhzlVtmZ8vgkI7PuVq9w02sS4XSgfOYCZsVRMkqfUBJHXjmFzRQK6m7jwpsI5Z82gbatajO56ivENmkY90or5AbAI7i1DWeLmxo"/>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">MadaLogistics</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant text-center mt-2 px-6">
                La solution logistique B2B référence pour les PME malgaches.
            </p>
</div>
<!-- Card Body -->
<div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant p-6 md:p-8">
<h2 class="font-headline-md text-headline-md text-on-surface mb-6">Créer un compte entreprise</h2>
<form class="space-y-4" id="signUpForm">
<!-- Company Name -->
<div class="input-group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-1.5 ml-1">Nom de l'entreprise</label>
<div class="relative">
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-body-md bg-transparent" placeholder="SARL Mada Express" required="" type="text"/>
</div>
</div>
<!-- Contact Name -->
<div class="input-group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-1.5 ml-1">Nom complet du contact</label>
<div class="relative">
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-body-md bg-transparent" placeholder="Jean Dupont" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div class="input-group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-1.5 ml-1">Email professionnel</label>
<div class="relative">
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-body-md bg-transparent" placeholder="contact@entreprise.mg" required="" type="email"/>
</div>
</div>
<!-- Phone -->
<div class="input-group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-1.5 ml-1">Téléphone</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 font-body-md text-on-surface-variant">+261</span>
<input class="w-full h-12 pl-14 pr-4 rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-body-md bg-transparent" placeholder="34 00 000 00" required="" type="tel"/>
</div>
</div>
<!-- Main Hub Selection -->
<div class="input-group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-1.5 ml-1">Hub principal</label>
<div class="relative">
<select class="w-full h-12 px-4 rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-body-md bg-transparent appearance-none" required="">
<option disabled="" selected="" value="">Sélectionnez votre ville</option>
<option value="Antananarivo">Antananarivo</option>
<option value="Toamasina">Toamasina</option>
<option value="Antsirabe">Antsirabe</option>
<option value="Mahajanga">Mahajanga</option>
<option value="Fianarantsoa">Fianarantsoa</option>
<option value="Toliara">Toliara</option>
</select>
<div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">expand_more</span>
</div>
</div>
</div>
<!-- Password -->
<div class="input-group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-1.5 ml-1">Mot de passe</label>
<div class="relative">
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-body-md bg-transparent" id="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Visual Strength Indicator -->
<div class="flex gap-1 mt-2 px-1">
<div class="password-strength-bar flex-1 bg-outline-variant" id="strength-1"></div>
<div class="password-strength-bar flex-1 bg-outline-variant" id="strength-2"></div>
<div class="password-strength-bar flex-1 bg-outline-variant" id="strength-3"></div>
<div class="password-strength-bar flex-1 bg-outline-variant" id="strength-4"></div>
</div>
<p class="text-[10px] uppercase font-label-sm tracking-wider mt-1 text-on-surface-variant px-1" id="strength-text">Force : Trop court</p>
</div>
<!-- Confirm Password -->
<div class="input-group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-1.5 ml-1">Confirmer le mot de passe</label>
<div class="relative">
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-body-md bg-transparent" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- T&C Checkbox -->
<div class="flex items-start gap-3 pt-2">
<input class="mt-1 w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary transition-all" id="cgu" required="" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant leading-snug" for="cgu">
                        J'accepte les <a class="text-primary font-medium underline underline-offset-2" href="#">Conditions Générales d'Utilisation</a> et la Politique de Confidentialité.
                    </label>
</div>
<!-- Submit Action -->
<div class="pt-4">
<button class="w-full h-12 bg-[#2563EB] hover:bg-primary-container text-white font-bold rounded-lg shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                        Créer mon compte
                        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</form>
</div>
<!-- Footer Link -->
<div class="mt-8 mb-12 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Déjà un compte ? 
                <a class="text-primary font-bold ml-1 hover:underline underline-offset-4" href="#">Se connecter</a>
</p>
</div>
</div>
<!-- Micro-interactions & Logic -->
<script>
        const passwordInput = document.getElementById('password');
        const strengthBars = [
            document.getElementById('strength-1'),
            document.getElementById('strength-2'),
            document.getElementById('strength-3'),
            document.getElementById('strength-4')
        ];
        const strengthText = document.getElementById('strength-text');

        passwordInput.addEventListener('input', (e) => {
            const val = e.target.value;
            let strength = 0;

            if (val.length > 0) {
                if (val.length >= 6) strength = 1;
                if (val.length >= 8 && /[A-Z]/.test(val)) strength = 2;
                if (val.length >= 10 && /[0-9]/.test(val)) strength = 3;
                if (val.length >= 12 && /[^A-Za-z0-9]/.test(val)) strength = 4;
            }

            // Reset
            strengthBars.forEach(bar => bar.classList.replace('bg-primary-container', 'bg-outline-variant'));
            strengthBars.forEach(bar => bar.classList.replace('bg-secondary', 'bg-outline-variant'));
            strengthBars.forEach(bar => bar.classList.replace('bg-error', 'bg-outline-variant'));

            if (strength === 0) {
                strengthText.innerText = "Force : Trop court";
                strengthText.className = "text-[10px] uppercase font-label-sm tracking-wider mt-1 text-on-surface-variant px-1";
            } else if (strength === 1) {
                strengthBars[0].classList.replace('bg-outline-variant', 'bg-error');
                strengthText.innerText = "Force : Faible";
                strengthText.className = "text-[10px] uppercase font-label-sm tracking-wider mt-1 text-error px-1";
            } else if (strength === 2) {
                strengthBars[0].classList.replace('bg-outline-variant', 'bg-tertiary-container');
                strengthBars[1].classList.replace('bg-outline-variant', 'bg-tertiary-container');
                strengthText.innerText = "Force : Moyen";
                strengthText.className = "text-[10px] uppercase font-label-sm tracking-wider mt-1 text-tertiary-container px-1";
            } else if (strength === 3) {
                strengthBars[0].classList.replace('bg-outline-variant', 'bg-primary');
                strengthBars[1].classList.replace('bg-outline-variant', 'bg-primary');
                strengthBars[2].classList.replace('bg-outline-variant', 'bg-primary');
                strengthText.innerText = "Force : Fort";
                strengthText.className = "text-[10px] uppercase font-label-sm tracking-wider mt-1 text-primary px-1";
            } else {
                strengthBars.forEach(bar => bar.classList.replace('bg-outline-variant', 'bg-secondary'));
                strengthText.innerText = "Force : Excellent";
                strengthText.className = "text-[10px] uppercase font-label-sm tracking-wider mt-1 text-secondary px-1";
            }
        });

        // Form submission animation (preventing real redirect)
        document.getElementById('signUpForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Création...';
            btn.disabled = true;
            
            setTimeout(() => {
                alert("Compte créé avec succès ! Bienvenue chez MadaLogistics.");
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }, 1500);
        });
    </script>
</body></html>
