<body class="flex flex-col min-h-screen text-on-surface">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-on-background w-full top-0 sticky z-50 border-b border-outline-variant dark:border-outline flex justify-between items-center px-margin-mobile h-16">

<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">MadaLogistics</h1>
</div>
<div class="flex items-center gap-sm">
<button class="p-2 rounded-full hover:bg-surface-container transition-colors duration-200">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="close">close</span>
</button>
</div>
</header>
<main class="flex-grow w-full max-w-lg mx-auto px-margin-mobile pt-lg pb-32">
<!-- Order Context Card -->
<section class="mb-lg">
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-lg flex flex-col gap-xs">
<span class="font-label-sm text-label-sm text-outline uppercase tracking-wider">Récapitulatif de livraison</span>
<h2 class="font-headline-md text-headline-md text-on-surface">Commande #ML-2024-9982</h2>
<div class="flex items-center gap-sm mt-sm">
<span class="material-symbols-outlined text-on-surface-variant text-md" data-icon="location_on">location_on</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Antananarivo, Madagascar</span>
</div>
</div>
</section>
<!-- Proof of Delivery Section -->
<section class="flex flex-col gap-lg">
<!-- Photo Upload Area -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">Preuve visuelle</label>
<div class="hidden w-full aspect-video rounded-xl bg-cover bg-center mb-sm border border-outline-variant" data-alt="A high-quality professional photograph of a delivered logistical package at a modern office doorstep in Madagascar. The scene is bathed in natural morning light, emphasizing a clean and corporate atmosphere. The package has a clear label with MadaLogistics branding, and the background shows a blurred, minimalist architectural entrance with sleek glass and steel." id="photo-preview" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuA7bf7IN3y0a058Z7sOJHWgk8rpblriFOO6_zkO0l9if9TI8o6mHAykBhgJarmCMWq8stHiavjs0uV71Fi5fJq-Jx4e5sm8EqvlBsnuwx-wSXAYjc9mihHmbGOkj7YrHAbWk6ngDvpzLa9lN6Vk0G_pQRh8_24ZeVcGjo9cOHaYXZzvjd_xCq2NLlGT82PfkPNL2OfzlWrCcanlM-GvhVymUhVOnNsmd8T4c0J0nimBr-VuPhQP3xE4hA')"></div>
<button class="w-full flex items-center justify-center gap-md py-xl border-2 border-dashed border-outline-variant rounded-xl text-on-surface-variant hover:bg-surface-container transition-all duration-200" id="add-photo-btn">
<div class="flex flex-col items-center gap-xs">
<span class="material-symbols-outlined text-3xl" data-icon="photo_camera">photo_camera</span>
<span class="font-label-md text-label-md">Ajouter photo preuve</span>
</div>
</button>

<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">Signature du client</label>

<canvas class="signature-canvas w-full h-full" id="signature-pad"></canvas>
<div class="absolute bottom-2 right-2">
<button class="flex items-center gap-xs bg-surface-variant/50 backdrop-blur-sm text-on-surface-variant px-md py-sm rounded-lg hover:bg-surface-variant transition-colors" id="clear-signature">
<span class="material-symbols-outlined text-sm" data-icon="delete">delete</span>

</button>
</div>
<div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-20" id="signature-placeholder">

</div>
</div>

<!-- Bottom Actions -->
<footer class="fixed bottom-0 w-full bg-surface/80 backdrop-blur-md px-margin-mobile pt-md pb-xl flex flex-col gap-md z-50 border-t border-outline-variant">
<button class="w-full h-16 bg-secondary text-on-secondary rounded-xl font-headline-md text-headline-md flex items-center justify-center gap-md shadow-lg active:scale-95 transition-all duration-150" id="confirm-delivery">
<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
            Confirmer la livraison
        </button>
</footer>
<script>
        // Simple Signature Pad Logic
        const canvas = document.getElementById('signature-pad');
        const ctx = canvas.getContext('2d');
        const clearBtn = document.getElementById('clear-signature');
        const placeholder = document.getElementById('signature-placeholder');
        let drawing = false;

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#0b1c30';
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function startPosition(e) {
            drawing = true;
            placeholder.style.display = 'none';
            draw(e);
        }

        function finishedPosition() {
            drawing = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!drawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', finishedPosition);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchstart', startPosition);
        canvas.addEventListener('touchend', finishedPosition);
        canvas.addEventListener('touchmove', draw);

        clearBtn.addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            placeholder.style.display = 'flex';
        });

        // Photo Upload Simulation
        const addPhotoBtn = document.getElementById('add-photo-btn');
        const photoPreview = document.getElementById('photo-preview');

        addPhotoBtn.addEventListener('click', () => {
            // Simulated toggle for demonstration
            photoPreview.classList.toggle('hidden');
            if (!photoPreview.classList.contains('hidden')) {
                addPhotoBtn.querySelector('span:last-child').textContent = "Changer la photo";
                addPhotoBtn.classList.replace('py-xl', 'py-md');
            } else {
                addPhotoBtn.querySelector('span:last-child').textContent = "Ajouter photo preuve";
                addPhotoBtn.classList.replace('py-md', 'py-xl');
            }
        });

        // Confirmation Animation
        const confirmBtn = document.getElementById('confirm-delivery');
        confirmBtn.addEventListener('click', () => {
            confirmBtn.innerHTML = `<span class="material-symbols-outlined animate-spin" data-icon="sync">sync</span> Traitement...`;
            confirmBtn.classList.replace('bg-secondary', 'bg-secondary-container');
            confirmBtn.classList.replace('text-on-secondary', 'text-on-secondary-container');
            
            setTimeout(() => {
                confirmBtn.innerHTML = `<span class="material-symbols-outlined" data-icon="task_alt">task_alt</span> Livraison Confirmée`;
                confirmBtn.classList.add('bg-on-secondary-fixed-variant');
                confirmBtn.classList.add('text-white');
                
                // Haptic feedback simulation
                if (window.navigator.vibrate) {
                    window.navigator.vibrate([100, 30, 100]);
                }
            }, 1500);
        });
    </script>
