<style>
        body {
            font-family: 'Hanken Grotesk', sans-serif;
            background-color: #f8f9ff;

        .material-symbols-outlined {

            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 0.3; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }

<body class="bg-background text-on-surface flex items-center justify-center min-h-screen p-margin-mobile">
<!-- Success Modal Overlay -->
<div class="fixed inset-0 bg-on-background/20 backdrop-blur-sm z-40 flex items-center justify-center animate-in fade-in duration-300">
<!-- Modal Container -->
<div class="modal-glass w-full max-w-[480px] rounded-xl border border-outline-variant shadow-2xl overflow-hidden animate-in zoom-in-95 duration-300">
<!-- Modal Body Content -->
<div class="px-xl py-xl flex flex-col items-center text-center">
<!-- Success Icon Cluster -->
<div class="relative mb-lg">
<div class="absolute inset-0 bg-[#16A34A]/20 rounded-full success-check-pulse scale-150"></div>
<div class="relative w-20 h-20 bg-white rounded-full flex items-center justify-center border-4 border-[#16A34A] shadow-sm">
<span class="material-symbols-outlined text-[48px] text-[#16A34A] font-bold" data-icon="check" style="font-variation-settings: 'FILL' 0;">check</span>
</div>
</div>
<!-- Headline -->
<h2 class="font-headline-md text-headline-md text-on-surface mb-md">Invitation envoyée !</h2>
<!-- Description -->
<p class="font-body-md text-body-md text-on-surface-variant mb-lg leading-relaxed">
                    L'invitation a été envoyée avec succès à <span class="font-bold text-primary">tahina.rakoto@transit.mg</span>. 
                    L'utilisateur apparaîtra avec le statut <span class="italic text-on-surface">"En attente"</span> jusqu'à l'activation.
                </p>
<!-- Status Badge -->
<div class="flex items-center gap-xs bg-[#FFF7ED] border border-[#FDBA74] px-md py-sm rounded-lg mb-xl">
<span class="material-symbols-outlined text-[18px] text-[#F97316]" data-icon="pending" style="font-variation-settings: 'FILL' 1;">pending</span>
<span class="font-label-md text-label-md text-[#C2410C]">En attente d'activation</span>
</div>
<!-- Actions -->
<div class="w-full flex flex-col gap-sm">
<button class="w-full py-md px-lg rounded-lg border border-outline text-primary font-bold font-label-md hover:bg-surface-container-low transition-colors active:scale-95 duration-150">
                        Fermer
                    </button>
</div>
</div>
<!-- Footer Graphic / Brand Anchor -->
<div class="bg-surface-container-low px-xl py-md flex justify-between items-center border-t border-outline-variant/30">
<div class="flex items-center gap-sm">
<div class="w-8 h-8 rounded bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[16px]" data-icon="local_shipping">local_shipping</span>
</div>
<span class="font-label-sm text-label-sm text-outline uppercase tracking-wider">MadaLogistics Hub</span>
</div>
<div class="text-[10px] font-label-sm text-outline-variant uppercase">ID: INV-88291-MADA</div>
</div>
</div>
</div>
<!-- Background Decoration (Bento style grid preview) -->

<script>
        // Simple ripple effect for the button
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', function(e) {
                const rect = this.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const ripple = document.createElement('span');
                ripple.style.left = `${x}px`;
                ripple.style.top = `${y}px`;
                ripple.classList.add('absolute', 'w-4', 'h-4', 'bg-primary/10', 'rounded-full', 'animate-ping', 'pointer-events-none');
                
                this.style.position = 'relative';
                this.style.overflow = 'hidden';
                this.appendChild(ripple);
                
                setTimeout(() => ripple.remove(), 1000);
            });
        });

        // Close modal logic (visual only for the demo)
        document.querySelector('button').addEventListener('click', () => {
            const modal = document.querySelector('.animate-in');
            modal.classList.remove('zoom-in-95', 'fade-in');
            modal.classList.add('zoom-out-95', 'fade-out');
            setTimeout(() => {
                document.querySelector('.fixed.inset-0.z-40').style.display = 'none';
            }, 300);
        });
    </script>
